name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-1"

# ─────────────────────────────────────────────────────────────────────────────
# BOOTSTRAP NOTE:
# The very first apply must be run LOCALLY with admin credentials, because
# the GitHub OIDC role that this workflow uses doesn't exist yet.
#
# Steps for a fresh AWS account:
#   1. aws configure (admin credentials)
#   2. bash bootstrap.sh              # creates S3 bucket + DynamoDB lock table
#   3. terraform init
#   4. terraform apply -var="github_token=ghp_xxx" -var-file=terraform.tfvars
#   5. Copy the github_iac_role_arn output into this repo's GitHub secret:
#      Settings → Secrets → Actions → AWS_ROLE_ARN
#   6. Add GH_PAT secret (your GitHub PAT) the same way.
#   7. All future changes can now go through this workflow.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── PR: validate + plan ──────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="github_token=${{ secrets.GH_PAT }}" \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const raw  = fs.readFileSync('plan_output.txt', 'utf8');
            const body = raw.length > 60000
              ? raw.substring(0, 60000) + '\n...(output truncated)'
              : raw;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         `## Terraform Plan\n\`\`\`hcl\n${body}\n\`\`\``
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Push to main: apply ───────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod   # optional: add approval gate in GitHub repo settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="github_token=${{ secrets.GH_PAT }}" \
            -auto-approve